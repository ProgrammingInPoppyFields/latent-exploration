<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Latent Exploration</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
  :root {
    --bg: #0a0a0f;
    --panel: #12121a;
    --line: #2a2a38;
    --node-real: #6ee7ff;
    --node-virtual: #3a3a4a;
    --node-selected: #ff6ec7;
    --path: #6ee7ff;
    --current: #ffffff;
    --root: #ffffff;
    --text: #e8e8f0;
    --text-dim: #8888a0;
    --accent: #6ee7ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #app { display: flex; height: 100vh; width: 100vw; }

  #graph-wrap {
    flex: 1 1 auto;
    position: relative;
    min-width: 0;
    perspective: 1500px;
    overflow: hidden;
  }
  #graph {
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
    transform: none;
    transform-origin: 50% 50%;
    transition: transform 0.5s ease;
  }
  #graph:active { cursor: grabbing; }
  #graph-wrap.tilted #graph { transform: rotateX(65deg); }

  #view-toggle {
    position: absolute;
    top: 18px;
    right: 24px;
    z-index: 3;
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 999px;
    overflow: hidden;
  }
  #view-toggle button {
    background: var(--panel);
    color: var(--text-dim);
    border: none;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 6px 14px;
    cursor: pointer;
    transition: color 0.15s ease, background 0.15s ease;
  }
  #view-toggle button + button { border-left: 1px solid var(--line); }
  #view-toggle button.active {
    background: var(--node-real);
    color: #06131a;
  }

  #sidebar-toggle {
    position: absolute;
    top: 50%;
    right: 8px;
    transform: translateY(-50%);
    width: 26px;
    height: 46px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text-dim);
    font-size: 13px;
    z-index: 3;
    user-select: none;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  #sidebar-toggle:hover {
    color: var(--text);
    border-color: var(--node-real);
  }

  header {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 18px 24px 10px;
    pointer-events: none;
    z-index: 2;
    background: linear-gradient(to bottom, rgba(10,10,15,0.9), rgba(10,10,15,0));
  }
  header h1 {
    margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text);
  }
  header p { margin: 4px 0 0; font-size: 12px; color: var(--text-dim); }

  .link {
    fill: none;
    stroke: var(--line);
    stroke-width: 2px;
  }
  .link.on-path {
    stroke: var(--path);
    stroke-width: 3px;
    filter: drop-shadow(0 0 4px var(--path));
  }
  .link.hover-path {
    stroke: var(--node-real);
    stroke-width: 3px;
    filter: drop-shadow(0 0 5px var(--node-real));
  }

  .node circle {
    stroke-width: 2px;
    cursor: default;
  }
  .node.real circle {
    fill: #101018;
    stroke: var(--node-real);
    cursor: pointer;
  }
  .node.virtual circle {
    fill: transparent;
    stroke: var(--node-virtual);
    stroke-dasharray: 2,2;
  }
  .node.on-path:not(.selected) circle,
  .node.hover-path:not(:hover) circle {
    fill: var(--path);
    stroke: var(--path);
    filter: drop-shadow(0 0 6px var(--path));
  }
  .node.selected circle,
  .node.real:hover circle {
    fill: var(--current);
    stroke: var(--current);
    filter: drop-shadow(0 0 14px var(--current));
  }
  .node.root.on-path circle,
  .node.root.hover-path circle {
    fill: var(--current);
    stroke: var(--current);
    filter: drop-shadow(0 0 16px var(--current));
  }
  .node.root circle {
    fill: none;
    stroke: var(--root);
    stroke-width: 4px;
    stroke-dasharray: none;
    cursor: pointer;
  }
  .node.root:hover circle,
  .node.root.active circle {
    fill: var(--root);
    filter: drop-shadow(0 0 18px var(--root)) drop-shadow(0 0 34px var(--root));
  }

  #sidebar {
    flex: 0 0 33vw;
    width: 33vw;
    background: var(--panel);
    border-left: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    padding: 20px;
    overflow-y: auto;
    transition: flex-basis 0.25s ease, width 0.25s ease, padding 0.25s ease, opacity 0.2s ease;
  }
  @media (orientation: portrait) {
    #sidebar {
      flex-basis: 80vw;
      width: 80vw;
    }
  }
  #sidebar.collapsed {
    flex-basis: 0;
    width: 0;
    padding-left: 0;
    padding-right: 0;
    border-left: none;
    overflow: hidden;
    opacity: 0;
  }
  #sidebar h2 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 0 0 12px;
  }
  #video-box {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #video-box video, #video-box img {
    width: 100%; height: 100%; object-fit: contain; display: none;
  }
  #video-placeholder {
    color: var(--text-dim);
    font-size: 13px;
    text-align: center;
    padding: 0 24px;
    line-height: 1.5;
  }
  #node-info {
    margin-top: 16px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px 14px;
  }
  #node-info .spec-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 5px 0;
  }
  #node-info .spec-row + .spec-row {
    border-top: 1px dashed var(--line);
  }
  #node-info .spec-label {
    color: var(--text-dim);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  #node-info .spec-leader {
    flex: 1;
    border-bottom: 1px dotted var(--line);
    margin-bottom: 4px;
    min-width: 8px;
  }
  #node-info .spec-value {
    color: var(--text);
    font-size: 12px;
    text-align: right;
    overflow-wrap: anywhere;
    max-width: 55%;
  }
  #node-info .spec-value.accent {
    color: var(--node-selected);
    font-weight: 600;
  }
  #children-list {
    margin-top: 16px;
  }
  #children-list button {
    display: block;
    width: 100%;
    text-align: left;
    background: #1a1a24;
    border: 1px solid var(--line);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    padding: 8px 10px;
    margin-bottom: 6px;
    border-radius: 6px;
    cursor: pointer;
  }
  #children-list button:hover {
    border-color: var(--node-real);
  }
  #legend {
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 11px;
    color: var(--text-dim);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #legend .row { display: flex; align-items: center; gap: 8px; }
  #legend .swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }

  #stats-badge {
    position: fixed;
    left: 16px;
    bottom: 14px;
    z-index: 4;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px;
    color: var(--text-dim);
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="app">
  <div id="graph-wrap">
    <header>
      <h1>Latent Exploration</h1>
      <p>Click a filled node to play its clip. Scroll/drag to pan &amp; zoom.</p>
    </header>
    <svg id="graph"></svg>
    <div id="sidebar-toggle">‹</div>
    <div id="view-toggle">
      <button data-view="3d">3D</button>
      <button data-view="2d" class="active">2D</button>
    </div>
  </div>
  <div id="sidebar">
    <h2>Now Playing</h2>
    <div id="video-box">
      <video id="video" controls loop playsinline></video>
      <img id="origin-img" src="origin_images/1.png" alt="Starting image" />
      <div id="video-placeholder">Select a node to play its clip</div>
    </div>
    <div id="node-info"></div>
    <div id="children-list"></div>
    <div id="legend">
      <div class="row"><span class="swatch" style="background:#101018;border:1.5px solid var(--node-real)"></span> has a clip</div>
      <div class="row"><span class="swatch" style="background:transparent;border:1.5px dashed var(--node-virtual)"></span> branch point, no clip kept</div>
      <div class="row"><span class="swatch" style="background:var(--path)"></span> path back to root</div>
      <div class="row"><span class="swatch" style="background:var(--current)"></span> current node</div>
    </div>
  </div>
</div>
<div id="stats-badge"></div>

<script>
const videoEl = document.getElementById("video");
const originImgEl = document.getElementById("origin-img");
const placeholderEl = document.getElementById("video-placeholder");
const infoEl = document.getElementById("node-info");
const childrenEl = document.getElementById("children-list");
const statsEl = document.getElementById("stats-badge");
const sidebarEl = document.getElementById("sidebar");
const sidebarToggleEl = document.getElementById("sidebar-toggle");
const graphWrapEl = document.getElementById("graph-wrap");
const viewToggleEl = document.getElementById("view-toggle");

let selectedId = null;
let originActive = false;
let nodeById = {};
let rootHierarchy = null;
let svg, g, zoom;
let sidebarOpen = false;

function setSidebarOpen(open) {
  sidebarOpen = open;
  sidebarEl.classList.toggle("collapsed", !open);
  sidebarToggleEl.textContent = open ? "›" : "‹";
}

sidebarToggleEl.addEventListener("click", () => setSidebarOpen(!sidebarOpen));
setSidebarOpen(false);

viewToggleEl.querySelectorAll("button").forEach(btn => {
  btn.addEventListener("click", () => {
    viewToggleEl.querySelectorAll("button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    graphWrapEl.classList.toggle("tilted", btn.dataset.view === "3d");
  });
});

fetch("tree.json")
  .then(r => r.json())
  .then(data => init(data));

function init(data) {
  nodeById = data.nodes;
  rootHierarchy = d3.hierarchy(data.nodes[data.root], d => d.children.map(cid => data.nodes[cid]));

  svg = d3.select("#graph");
  g = svg.append("g");

  zoom = d3.zoom()
    .scaleExtent([0.05, 5])
    .on("zoom", (event) => g.attr("transform", event.transform));
  svg.call(zoom);

  const total = Object.values(data.nodes).length;
  const originCount = Object.values(data.nodes).filter(n => n.parent === null).length;
  const nodeCount = total - originCount;
  statsEl.textContent = `${nodeCount} nodes / ${originCount} origin node${originCount !== 1 ? "s" : ""}`;

  draw();
}

function nodeRadius(d) {
  if (d.depth === 0) return 40;
  const base = d.data.virtual ? 5 : 7;
  const childBonus = Math.min(d.data.children.length, 6) * 1.8;
  return base + childBonus;
}

function showOriginImage() {
  videoEl.style.display = "none";
  placeholderEl.style.display = "none";
  originImgEl.style.display = "block";
}

function hideOriginImage() {
  if (originActive) return;
  originImgEl.style.display = "none";
  if (selectedId) {
    videoEl.style.display = "block";
    videoEl.play().catch(() => {});
  } else {
    placeholderEl.style.display = "block";
  }
}

function specRow(label, value, accent) {
  return `<div class="spec-row"><span class="spec-label">${label}</span><span class="spec-leader"></span><span class="spec-value${accent ? " accent" : ""}">${value}</span></div>`;
}

function selectRoot() {
  selectedId = null;
  originActive = true;
  setSidebarOpen(true);
  videoEl.pause();
  d3.selectAll(".node").classed("selected", false).classed("on-path", false).classed("active", false);
  d3.selectAll(".link").classed("on-path", false);
  d3.select("#node-0").classed("active", true);
  showOriginImage();

  const root = nodeById["0"];
  infoEl.innerHTML =
    specRow("NODE ID", "0 (ORIGIN)") +
    specRow("DEPTH LEVEL", "0") +
    specRow("CHILD NODES", root.children.length) +
    specRow("PARENT NODE ID", "—");
  childrenEl.innerHTML = "";
  if (root.children.length) {
    const label = document.createElement("div");
    label.style.cssText = "font-size:11px;color:var(--text-dim);margin-bottom:6px;";
    label.textContent = "Branches from here:";
    childrenEl.appendChild(label);
    root.children.forEach(cid => {
      const c = nodeById[cid];
      const btn = document.createElement("button");
      btn.textContent = `${cid.split("_").pop()} → ${cid}${c.virtual ? "  (no clip)" : ""}${c.label ? `  "${c.label}"` : ""}`;
      btn.onclick = () => (!c.virtual ? selectNode(cid) : null);
      childrenEl.appendChild(btn);
    });
  }
}

function layoutRadial(root) {
  const innerRadius = 110; // clearance around the big origin node
  const ringStep = 48;
  const availableRadius = Math.max(root.height, 1) * ringStep;
  d3.tree()
    .size([2 * Math.PI, availableRadius])
    .separation((a, b) => (a.parent === b.parent ? 1.6 : 3.2) / a.depth)(root);
  root.each(d => { if (d.depth > 0) d.y += innerRadius; });
  return availableRadius + innerRadius + 60; // total radius; root stays at local (0,0)
}

function draw() {
  g.selectAll("*").remove();

  const totalRadius = layoutRadial(rootHierarchy);
  const diameter = totalRadius * 2;

  const linkPath = d3.linkRadial().angle(d => d.x).radius(d => d.y);
  const nodeTransform = d => `rotate(${(d.x * 180 / Math.PI) - 90}) translate(${d.y},0)`;

  g.append("g").selectAll("path")
    .data(rootHierarchy.links())
    .join("path")
    .attr("class", "link")
    .attr("id", d => `link-${d.target.data.id}`)
    .attr("d", linkPath);

  const node = g.append("g").selectAll("g")
    .data(rootHierarchy.descendants())
    .join("g")
    .attr("class", d => `node ${d.data.virtual ? "virtual" : "real"}${d.depth === 0 ? " root" : ""}`)
    .attr("id", d => `node-${d.data.id}`)
    .attr("transform", nodeTransform)
    .on("click", (event, d) => {
      if (d.depth === 0) selectRoot();
      else if (!d.data.virtual) selectNode(d.data.id);
    })
    .on("mouseenter", (event, d) => {
      if (d.depth === 0) showOriginImage();
      else if (!d.data.virtual) applyHoverPath(d.data.id);
    })
    .on("mouseleave", (event, d) => {
      if (d.depth === 0) hideOriginImage();
      else clearHoverPath();
    });

  node.append("circle").attr("r", nodeRadius);

  if (selectedId) applyHighlight(selectedId);

  const wrap = document.getElementById("graph-wrap");
  const vw = wrap.clientWidth, vh = wrap.clientHeight;
  const scale = Math.min(vw / diameter, vh / diameter, 1) * 0.92;
  const t = d3.zoomIdentity.translate(vw / 2, vh / 2).scale(scale);
  svg.call(zoom.transform, t);
}

function applyHoverPath(id) {
  let cur = nodeById[id];
  const chain = [];
  while (cur) { chain.push(cur.id); cur = cur.parent ? nodeById[cur.parent] : null; }
  chain.forEach(nid => {
    d3.select(`#node-${CSS.escape(nid)}`).classed("hover-path", true);
    d3.select(`#link-${CSS.escape(nid)}`).classed("hover-path", true);
  });
}

function clearHoverPath() {
  d3.selectAll(".node").classed("hover-path", false);
  d3.selectAll(".link").classed("hover-path", false);
}

function applyHighlight(id) {
  d3.selectAll(".node").classed("selected", false).classed("on-path", false).classed("active", false);
  d3.selectAll(".link").classed("on-path", false);
  let cur = nodeById[id];
  const chain = [];
  while (cur) { chain.push(cur.id); cur = cur.parent ? nodeById[cur.parent] : null; }
  chain.forEach(nid => {
    d3.select(`#node-${CSS.escape(nid)}`).classed("on-path", true);
    d3.select(`#link-${CSS.escape(nid)}`).classed("on-path", true);
  });
  d3.select(`#node-${CSS.escape(id)}`).classed("selected", true);
}

function selectNode(id) {
  selectedId = id;
  originActive = false;
  originImgEl.style.display = "none";
  setSidebarOpen(true);
  const n = nodeById[id];
  applyHighlight(id);

  videoEl.src = n.video;
  videoEl.style.display = "block";
  placeholderEl.style.display = "none";
  videoEl.play().catch(() => {});

  const depth = id.split("_").length;
  infoEl.innerHTML =
    specRow("NODE ID", id) +
    specRow("DEPTH LEVEL", depth) +
    specRow("CHILD NODES", n.children.length) +
    specRow("PARENT NODE ID", n.parent ?? "—") +
    (n.label ? specRow("LABEL", `"${n.label}"`, true) : "");

  childrenEl.innerHTML = "";
  if (n.children.length) {
    const label = document.createElement("div");
    label.style.cssText = "font-size:11px;color:var(--text-dim);margin-bottom:6px;";
    label.textContent = "Branches from here:";
    childrenEl.appendChild(label);
    n.children.forEach(cid => {
      const c = nodeById[cid];
      const btn = document.createElement("button");
      btn.textContent = `${cid.split("_").pop()} → ${cid}${c.virtual ? "  (no clip)" : ""}${c.label ? `  "${c.label}"` : ""}`;
      btn.disabled = c.virtual && c.children.length === 0;
      btn.onclick = () => {
        if (!c.virtual) selectNode(cid);
        else if (c.children.length) selectNode(c.children[0]);
      };
      childrenEl.appendChild(btn);
    });
  }
}
</script>
</body>
</html>
